# ═══════════════════════════════════════════════════════
# HenFarmTycoon — Production stack (Phase 20)
#   app   : Next.js standalone (game + admin panel + APIs)
#   redis : cache / future rate-limit store / sessions
#   nginx : reverse proxy (TLS termination in prod)
# ═══════════════════════════════════════════════════════

services:
  app:
    build: .
    container_name: henfarm-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NODE_ENV=production
    volumes:
      - app-data:/app/db            # persist SQLite database
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: henfarm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    container_name: henfarm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app-data:
  redis-data:
